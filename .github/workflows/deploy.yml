name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ensure only one deployment runs at a time to avoid CloudFormation concurrency collisions
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
          TEST_DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
          APP_ENV: test
          AUTH_MODE: local
          DB_AUTH_MODE: password
          LLM_DEFAULT: fake
        run: |
          cd backend
          pytest

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Vitest
        run: |
          cd frontend
          npm test

  deploy:
    name: Deploy to AWS
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate AWS Role Configuration
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN is missing! Add AWS_ROLE_ARN under GitHub Settings -> Secrets and variables -> Actions (as either a Secret or a Variable)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "iac/package-lock.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install IaC Dependencies & Sync Frontend
        run: |
          cd iac
          npm ci
          npm run sync-frontend

      - name: Compile IaC TypeScript
        run: |
          cd iac
          npm run build

      - name: Deploy CDK Stacks
        run: |
          cd iac
          npx cdk deploy --all --require-approval never

      - name: Smoke Test Live URL
        run: |
          echo "Verifying health endpoint at https://aichat.taitrd.com/healthz..."
          curl -f --retry 6 --retry-delay 10 --retry-connrefused https://aichat.taitrd.com/healthz
