name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ensure only one deployment runs at a time to avoid CloudFormation concurrency collisions
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
          TEST_DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
          APP_ENV: test
          AUTH_MODE: local
          DB_AUTH_MODE: password
          LLM_DEFAULT: fake
        run: |
          cd backend
          pytest

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Vitest
        run: |
          cd frontend
          npm test

  deploy:
    name: Deploy to AWS
    needs: [test-backend, test-frontend]
    # The Lambda image is ARM64 (Graviton). Building it on an x86 runner fails with
    # "exec format error" during RUN steps, so build on a native ARM runner instead.
    # (Free for public repos. For a private repo without ARM runners, use ubuntu-latest
    # and add docker/setup-qemu-action@v3 before Buildx, which is slower.)
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read
    # Vite bakes VITE_* values into the JavaScript at build time, so every frontend
    # build in this job (npm run build and npm run sync-frontend) needs them.
    # Set them under Settings -> Secrets and variables -> Actions -> Variables.
    # They're public (they ship in the bundle), so never put secrets in VITE_*.
    env:
      VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE || 'cognito' }}
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deploy Configuration
        run: |
          missing=0
          if [ -z "${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN is missing. Add it under Settings -> Secrets and variables -> Actions (as a Secret or a Variable)."
            missing=1
          fi
          if [ "$VITE_AUTH_MODE" != "cognito" ]; then
            echo "::error::VITE_AUTH_MODE is '$VITE_AUTH_MODE'. Production must use 'cognito', because the backend only accepts Cognito tokens."
            missing=1
          fi
          # The browser signs in with the app client ID and region; the pool ID is optional.
          if [ -z "$VITE_COGNITO_CLIENT_ID" ]; then
            echo "::error::VITE_COGNITO_CLIENT_ID is missing. Add it as an Actions Variable (ChatAuth stack output UserPoolClientId)."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Frontend build config: auth=$VITE_AUTH_MODE region=$VITE_AWS_REGION pool=$VITE_COGNITO_USER_POOL_ID api=$VITE_API_BASE_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "iac/package-lock.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install IaC Dependencies & Sync Frontend
        run: |
          cd iac
          npm ci
          npm run sync-frontend

      - name: Compile IaC TypeScript
        run: |
          cd iac
          npm run build

      - name: Deploy CDK Stacks
        run: |
          cd iac
          npx cdk deploy --all --require-approval never

      - name: Smoke Test Live URL
        run: |
          echo "Verifying health endpoint at https://aichat.taitrd.com/healthz..."
          curl -f --retry 6 --retry-delay 10 --retry-connrefused https://aichat.taitrd.com/healthz
